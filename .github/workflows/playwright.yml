name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright browsers
      run: pnpm run install:browsers

    - name: Run Playwright tests
      run: pnpm test:ci
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}
        TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
        TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
        TEST_ARTIST_EMAIL: ${{ secrets.TEST_ARTIST_EMAIL }}
        TEST_ARTIST_PASSWORD: ${{ secrets.TEST_ARTIST_PASSWORD }}

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: reports/html/
        retention-days: 30

    - name: Upload test results (JSON)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-json
        path: reports/json/
        retention-days: 30
